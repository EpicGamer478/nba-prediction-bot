<style>
/* Layout: one narrow column — budget bar, winners list, props list, summary. Quiet neutrals, one hardwood-orange accent. */
:root {
  --bg: #f6f7f9; --surface: #ffffff; --line: #e4e7ec; --fg: #0f1419; --muted: #6a7380; --faint: #eef0f3;
  --accent: #d9541e; --accent-soft: #fbe9e1; --good: #128a5a;
  --sans: "Geist", ui-sans-serif, system-ui, -apple-system, sans-serif;
  --mono: "Geist Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --bg: #0b0d10; --surface: #13161b; --line: #232830; --fg: #eef1f5; --muted: #8b94a1; --faint: #1a1e25;
  --accent: #ff7a3d; --accent-soft: #2c1910; --good: #3fcf8e; color-scheme: dark } }
:root[data-theme="dark"] {
  --bg: #0b0d10; --surface: #13161b; --line: #232830; --fg: #eef1f5; --muted: #8b94a1; --faint: #1a1e25;
  --accent: #ff7a3d; --accent-soft: #2c1910; --good: #3fcf8e; color-scheme: dark }
* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--sans); font-size: 15px; line-height: 1.45; -webkit-font-smoothing: antialiased }
.page { max-width: 680px; margin: 0 auto; padding-block: 40px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 36px }
.top { display: flex; flex-direction: column; gap: 6px }
.eyebrow { font-family: var(--mono); font-size: 12px; color: var(--muted); letter-spacing: .04em; text-transform: uppercase }
h1 { margin: 0; font-size: 34px; font-weight: 700; letter-spacing: -.025em; text-wrap: balance }
.budget { display: flex; align-items: center; gap: 12px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 6px 6px 6px 16px }
.budget label { color: var(--muted); font-size: 14px; white-space: nowrap }
.budget .field { flex: 1; display: flex; align-items: center; gap: 2px; font-family: var(--mono); font-size: 22px; font-weight: 500; min-width: 0 }
.budget input { border: 0; background: transparent; color: var(--fg); font: inherit; width: 100%; min-width: 0; padding: 8px 0 }
.budget input:focus { outline: none }
.budget:focus-within { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft) }
.chips { display: flex; gap: 4px }
.chips button { appearance: none; border: 0; background: var(--faint); color: var(--fg); font: 500 13px var(--mono); padding: 8px 10px; border-radius: 9px; cursor: pointer }
.chips button:hover { background: var(--accent-soft); color: var(--accent) }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
@media (max-width: 480px) { .chips button:nth-child(n+3) { display: none } h1 { font-size: 28px } }
section { display: flex; flex-direction: column; gap: 10px }
.sh { display: flex; justify-content: space-between; align-items: baseline; gap: 12px }
h2 { margin: 0; font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .08em; color: var(--muted) }
.sh .meta { font-size: 12px; color: var(--muted); font-family: var(--mono) }
.list { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.row { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 14px; align-items: center; padding: 14px 16px; border-top: 1px solid var(--line) }
.row:first-child { border-top: 0 }
.who { display: flex; align-items: center; gap: 12px; min-width: 0 }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none }
.name { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.sub { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis }
.txt { min-width: 0 }
.right { display: flex; align-items: center; gap: 14px }
.conf { display: flex; flex-direction: column; align-items: flex-end; gap: 5px; min-width: 64px }
.pct { font-family: var(--mono); font-weight: 600; font-variant-numeric: tabular-nums }
.bar { width: 64px; height: 4px; background: var(--faint); border-radius: 2px; overflow: hidden }
.bar i { display: block; height: 100%; background: var(--fg); border-radius: 2px }
.stake { font-family: var(--mono); font-size: 13px; font-weight: 600; padding: 5px 9px; border-radius: 8px; min-width: 64px; text-align: center; font-variant-numeric: tabular-nums }
.stake.on { background: var(--accent-soft); color: var(--accent) }
.stake.off { color: var(--muted); background: var(--faint); font-weight: 500 }
.side { font-family: var(--mono); font-size: 12px; font-weight: 600; letter-spacing: .03em }
.side.over { color: var(--good) } .side.under { color: var(--accent) }
.summary { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 1px; background: var(--line); border: 1px solid var(--line); border-radius: 14px; overflow: hidden }
.summary div { background: var(--surface); padding: 14px 16px }
.summary .k { font-size: 12px; color: var(--muted) }
.summary .v { font-family: var(--mono); font-size: 20px; font-weight: 600; margin-top: 2px; font-variant-numeric: tabular-nums }
@media (max-width: 480px) { .summary { grid-template-columns: minmax(0, 1fr) } }
.note { font-size: 13px; color: var(--muted); max-width: 62ch; margin: 0 }
.note b { color: var(--fg); font-weight: 600 }
.empty { padding: 20px 16px; color: var(--muted); font-size: 14px }
.tabs { display: inline-flex; align-self: flex-start; background: var(--faint); border-radius: 11px; padding: 3px; gap: 2px; margin-top: -18px }
.tabs button { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 14px var(--sans); padding: 7px 16px; border-radius: 8px; cursor: pointer }
.tabs button[aria-selected="true"] { background: var(--surface); color: var(--fg); box-shadow: 0 1px 2px rgb(0 0 0 / .08), 0 0 0 1px var(--line) }
.view { display: flex; flex-direction: column; gap: 36px }
.view[hidden] { display: none }
.summary .s { font-size: 12px; color: var(--muted); margin-top: 2px; font-family: var(--mono) }
.lead { margin: -18px 0 0; color: var(--muted); font-size: 14px; max-width: 62ch }
.chart { position: relative; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 12px 6px }
.chart svg { display: block; width: 100%; height: 220px; overflow: visible; touch-action: pan-y }
.chart text { fill: var(--muted); font: 11px var(--mono) }
.chart .endlbl { fill: var(--fg); font-weight: 600 }
.tip { position: absolute; top: 8px; pointer-events: none; background: var(--fg); color: var(--bg); font: 12px/1.35 var(--mono); padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translateX(-50%) }
.tip[hidden] { display: none }
.tbl .row { grid-template-columns: minmax(0, 1fr) 64px 64px 72px; gap: 8px }
.tbl .hd { font-size: 12px; color: var(--muted); padding-block: 10px; background: var(--faint) }
.tbl .num { font-family: var(--mono); font-variant-numeric: tabular-nums; text-align: right }
.tbl .num.dim { color: var(--muted) }
.pill.lock { color: var(--good); background: color-mix(in srgb, var(--good) 14%, transparent) }
.tbl .row.hi { background: var(--accent-soft) }
.pill { font: 600 11px var(--mono); color: var(--accent); background: var(--accent-soft); padding: 2px 6px; border-radius: 6px; margin-left: 6px; vertical-align: 1px }
.seg { display: flex; gap: 4px; flex-wrap: wrap }
.seg button { appearance: none; border: 0; background: var(--faint); color: var(--muted); font: 500 12px var(--mono); padding: 6px 9px; border-radius: 8px; cursor: pointer }
.seg button[aria-pressed="true"] { background: var(--fg); color: var(--bg) }
@media (max-width: 480px) { .tbl .row { grid-template-columns: minmax(0, 1fr) 52px 52px 60px; gap: 6px; padding-inline: 12px } }
.hidden-sm { }
@media (max-width: 480px) { .hidden-sm { display: none } .right { gap: 10px } }
</style>

// Quarter-Kelly sizing, capped per bet, scaled so the total never exceeds the budget.
function allocate(bets, budget) {
  bets.forEach(b => {
    if (b.p == null || b.odds == null) { b.frac = 0; return; }
    const k = (payout(b.odds) * b.p - (1 - b.p)) / payout(b.odds);
    b.frac = Math.min(D.kelly_fraction * Math.max(0, k), D.max_per_bet);
  });
  const total = bets.reduce((s, b) => s + b.frac, 0);
  const scale = total > 1 ? 1 / total : 1;
  bets.forEach(b => {
    b.stake = Math.floor(budget * b.frac * scale * 100) / 100;
    b.ev = b.p == null ? 0 : b.stake * (b.p * payout(b.odds) - (1 - b.p));
  });
}

const LK = (D.bt && D.bt.locks) || D.locks_backtest || null;
const LOCK = LK ? LK.threshold : 0.8;
const wins = D.winners.slice().sort((a, b) => b.p_model - a.p_model);
const props = D.props;

function stakeChip(b, budget) {
  if (!budget) return "";
  return b.stake > 0 ? `<span class="stake on">${usd(b.stake)}</span>` : `<span class="stake off" title="No edge over the sportsbook price">skip</span>`;
}

function render() {
  const budget = Math.max(0, parseFloat($("#budget").value) || 0);
  allocate([...wins, ...props], budget);

  const isLock = w => w.lock ?? (w.p_model >= LOCK);
  const row = w => {
    const t = w.tip ? new Date(w.tip).toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    return `<div class="row">
      <div class="who"><span class="dot" style="background:#${esc(w.color || "8a8f98")}"></span>
        <div class="txt"><div class="name">${esc(w.team)}</div>
        <div class="sub">${w.at_home ? "vs" : "at"} ${esc(w.opp)}${t ? " · " + t : ""}${w.odds != null ? " · " + fmtOdds(w.odds) : ""}</div></div></div>
      <div class="right">
        <div class="conf"><span class="pct">${Math.round(w.p_model * 100)}%</span><span class="bar"><i style="width:${(w.p_model * 100).toFixed(0)}%"></i></span></div>
        ${stakeChip(w, budget)}
      </div></div>`;
  };
  const lk = wins.filter(isLock), rest = wins.filter(w => !isLock(w));
  $("#locks").innerHTML = lk.length ? lk.map(row).join("")
    : `<div class="empty">No locks tonight. No team is ${Math.round(LOCK * 100)}%+ to win.</div>`;
  $("#winners").innerHTML = rest.map(row).join("");
  $("#winners").closest("section").hidden = !rest.length;
  $("#w-title").textContent = lk.length ? "Other games" : "Winners";

  $("#props").innerHTML = props.length ? props.map(p => `<div class="row">
      <div class="who"><div class="txt"><div class="name">${esc(p.name)}</div>
        <div class="sub"><span class="side ${p.side}">${p.side.toUpperCase()} ${p.line}</span> · ${fmtOdds(p.odds)} · projects ${p.proj}<span class="hidden-sm"> · ${esc(p.team)}</span></div></div></div>
      <div class="right">
        <div class="conf"><span class="pct">${Math.round(p.p * 100)}%</span><span class="bar"><i style="width:${(p.p * 100).toFixed(0)}%"></i></span></div>
        ${stakeChip(p, budget)}
      </div></div>`).join("")
    : `<div class="empty">Points props aren't posted yet. They usually appear by early afternoon.</div>`;

  const all = [...wins, ...props];
  const bet = all.reduce((s, b) => s + b.stake, 0), ev = all.reduce((s, b) => s + b.ev, 0);
  $("#sum-wrap").hidden = !budget;
  $("#s-bet").textContent = usd(bet);
  $("#s-keep").textContent = usd(Math.max(0, budget - bet));
  $("#s-ev").textContent = (ev >= 0 ? "+" : "−") + usd(Math.abs(ev));
}

const day = new Date(D.date + "T12:00:00");
$("#when").textContent = day.toLocaleDateString([], { weekday: "long", month: "long", day: "numeric" }) + " · " + D.winners.length + " games";
const gb = D.game_backtest, pb = D.props_backtest;
$("#w-meta").textContent = gb ? `${(gb.winner_acc_model * 100).toFixed(0)}% right in backtest` : "";
$("#l-meta").textContent = LK ? `${Math.round(LOCK * 100)}%+ confident · ${(LK.acc * 100).toFixed(0)}% won in backtest` : "";
$("#p-meta").textContent = pb ? `${(pb.hit_rate * 100).toFixed(0)}% hit in backtest` : "";
$("#foot").innerHTML = `Percentages are the model's chance each pick hits. With a budget entered, amounts use <b>quarter Kelly</b>: bigger stakes where the model sees more value, <b>skip</b> where it sees none, and never more than ${Math.round(D.max_per_bet * 100)}% on one bet. The backtest hasn't shown a reliable edge over sportsbook lines, so treat amounts as a guide. Lines as of ${esc(D.generated.replace("T", " "))}.`;

$("#budget").addEventListener("input", () => { render(); try { localStorage.setItem("budget", $("#budget").value); } catch (e) {} });
document.querySelectorAll(".chips button").forEach(b => b.addEventListener("click", () => { $("#budget").value = b.dataset.v; render(); try { localStorage.setItem("budget", b.dataset.v); } catch (e) {} }));
try { const v = localStorage.getItem("budget"); if (v) $("#budget").value = v; } catch (e) {}
render();

// ---------- Backtest tab ----------
const B = D.bt || {};
const pct = (v, d = 1) => v == null ? "–" : (v * 100).toFixed(d) + "%";
const units = v => (v >= 0 ? "+" : "−") + Math.abs(v).toFixed(1) + "u";
const seasonLbl = s => `${s - 1}-${String(s).slice(2)}`;
const NAMES = { stats_only: "Stats only (ignores the line)", market_blend: "Line + small adjustment",
                market_gbm: "Line + boosted trees" };

function renderBacktest() {
  const a = B.accuracy;
  if (!a) { $("#bt-lead").textContent = "No backtest yet."; return; }
  const seasons = Object.keys(B.acc_by_season || {}).map(Number).sort();
  $("#bt-lead").textContent = `Tested on ${a.games.toLocaleString()} games from ${seasonLbl(seasons[0])} to now. ` +
    `Each month was predicted by a model trained only on the games before it.`;

  const t4 = B.by_threshold["0.04"] || {};
  const nb = Object.values(t4).reduce((s, m) => s + m.bets, 0), pf = Object.values(t4).reduce((s, m) => s + m.profit, 0);
  $("#bt-tiles").innerHTML = `
    <div><div class="k">Picked the winner</div><div class="v">${pct(a.winner_acc_model)}</div><div class="s">favorite: ${pct(a.winner_acc_market)}</div></div>
    <div><div class="k">Games tested</div><div class="v">${a.games.toLocaleString()}</div><div class="s">${seasons.length} seasons</div></div>
    <div><div class="k">Profit on its bets</div><div class="v">${units(pf)}</div><div class="s">${nb.toLocaleString()} bets · ${pct(nb ? pf / nb : 0)} each</div></div>`;

  $("#bt-seasons").innerHTML = `<div class="row hd"><span>Season</span><span class="num">Games</span><span class="num">Model</span><span class="num">Favorite</span></div>` +
    seasons.map((s, i) => { const r = B.acc_by_season[s]; return `<div class="row">
      <span class="name">${seasonLbl(s)}${i === seasons.length - 1 ? ' <span class="sub" style="display:inline">so far</span>' : ""}</span>
      <span class="num dim">${r.games.toLocaleString()}</span><span class="num">${pct(r.winner_acc_model)}</span><span class="num dim">${pct(r.winner_acc_market)}</span></div>`; }).join("");

  if (LK) {
    $("#bl-meta").textContent = `betting them returned ${(LK.roi >= 0 ? "+" : "") + pct(LK.roi)} per bet`;
    $("#bt-locks").innerHTML = `<div class="row hd"><span>Only pick when model is</span><span class="num">Games</span><span class="num">Won</span><span class="num">Per night</span></div>` +
      Object.entries(LK.by_level).map(([t, r]) => `<div class="row${+t === LOCK ? " hi" : ""}">
        <span class="name">${Math.round(t * 100)}%+ sure${+t === LOCK ? '<span class="pill lock">locks</span>' : ""}</span>
        <span class="num dim">${r.games.toLocaleString()}</span><span class="num">${pct(r.acc)}</span>
        <span class="num dim">${(r.games * LK.per_night / LK.games).toFixed(1)}</span></div>`).join("");
  } else $("#bt-locks").closest("section").hidden = true;
  const vs = B.variants || {};
  $("#bt-variants").innerHTML = `<div class="row hd"><span>Version</span><span class="num">Winner</span><span class="num">Error</span><span class="num">Book</span></div>` +
    Object.keys(vs).map(k => `<div class="row">
      <span class="name">${esc(NAMES[k] || k)}${k === B.model ? '<span class="pill">used</span>' : ""}</span>
      <span class="num">${pct(vs[k].winner_acc_model)}</span><span class="num">${vs[k].brier_model.toFixed(4)}</span><span class="num dim">${vs[k].brier_market.toFixed(4)}</span></div>`).join("");

  const pr = B.props;
  if (pr) {
    $("#pr-meta").textContent = `${pr.days} days this season`;
    $("#bt-props").innerHTML = `
      <div><div class="k">Props tested</div><div class="v">${pr.props.toLocaleString()}</div><div class="s">DraftKings lines</div></div>
      <div><div class="k">Top-5 picks hit</div><div class="v">${pct(pr.hit_rate, 0)}</div><div class="s">${pr.picks} picks</div></div>
      <div><div class="k">Profit</div><div class="v">${units(pr.units)}</div><div class="s">${pct(pr.roi)} each</div></div>`;
  } else $("#bt-props").closest("section").hidden = true;

  $("#bt-foot").innerHTML = `<b>Favorite</b> means always taking the team the sportsbook favors. <b>Error</b> (Brier score) measures how close the win percentages were to what happened; the version with the lowest error is the one used for tonight. Bets are 1 unit each at the closing price, spreads and totals at −110. Over this many games, matching the sportsbook is the realistic ceiling; no version has beaten it.`;
}

let thr = "0.04";
function renderMarkets() {
  const ts = Object.keys(B.by_threshold || {});
  $("#thr").innerHTML = ts.map(t => `<button aria-pressed="${t === thr}" data-t="${t}">${Math.round(t * 100)}%+</button>`).join("");
  const mk = B.by_threshold?.[thr] || {};
  $("#bt-markets").innerHTML = `<div class="row hd"><span>Market</span><span class="num">Bets</span><span class="num">Won</span><span class="num">Return</span></div>` +
    ["moneyline", "spread", "total"].map(m => { const r = mk[m] || { bets: 0 }; return `<div class="row">
      <span class="name">${m === "moneyline" ? "Moneyline" : m === "spread" ? "Spread" : "Total"}</span>
      <span class="num dim">${r.bets.toLocaleString()}</span><span class="num">${r.bets ? pct(r.win_rate) : "–"}</span>
      <span class="num">${r.bets ? (r.roi >= 0 ? "+" : "") + pct(r.roi) : "–"}</span></div>`; }).join("");
  $("#thr").querySelectorAll("button").forEach(b => b.onclick = () => { thr = b.dataset.t; renderMarkets(); });
}

function drawCurve() {
  const pts = B.curve, box = $("#curve"), svg = box.querySelector("svg"), tip = box.querySelector(".tip");
  if (!pts || pts.length < 2) { box.closest("section").hidden = true; return; }
  const last = pts[pts.length - 1];
  $("#c-meta").textContent = `1 unit per bet · ${last[2].toLocaleString()} bets`;
  const W = svg.clientWidth || 600, H = 220, L = 44, R = 52, T = 10, Bt = 22;
  const ys = pts.map(p => p[1]), lo = Math.min(0, ...ys), hi = Math.max(0, ...ys);
  const step = [5, 10, 20, 25, 50, 100, 200].find(s => (hi - lo) / s <= 5) || 500;
  const y0 = Math.floor(lo / step) * step, y1 = Math.ceil(hi / step) * step;
  const X = i => L + (W - L - R) * i / (pts.length - 1), Y = v => T + (H - T - Bt) * (y1 - v) / (y1 - y0 || 1);
  let g = "";
  for (let v = y0; v <= y1 + 1e-9; v += step)
    g += `<line x1="${L}" x2="${W - R}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--${v === 0 ? "muted" : "line"})" stroke-width="1" ${v === 0 ? 'stroke-dasharray="3 3"' : ""}/>` +
         `<text x="${L - 8}" y="${Y(v) + 4}" text-anchor="end">${v > 0 ? "+" : ""}${v}</text>`;
  let seen = new Set();
  pts.forEach((p, i) => { const yr = p[0].slice(0, 4); if (!seen.has(yr) && p[0].slice(5, 7) <= "02") { seen.add(yr);
    g += `<text x="${X(i)}" y="${H - 4}" text-anchor="middle">${yr}</text>`; } });
  const d = pts.map((p, i) => (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p[1]).toFixed(1)).join("");
  g += `<path d="${d}" fill="none" stroke="var(--accent)" stroke-width="2" stroke-linejoin="round"/>`;
  g += `<text class="endlbl" x="${X(pts.length - 1) + 6}" y="${Y(last[1]) + 4}">${units(last[1])}</text>`;
  g += `<g id="hv" visibility="hidden"><line id="hv-l" y1="${T}" y2="${H - Bt}" stroke="var(--muted)" stroke-width="1"/>` +
       `<circle id="hv-c" r="4" fill="var(--accent)" stroke="var(--surface)" stroke-width="2"/></g>` +
       `<rect x="${L}" y="0" width="${W - L - R}" height="${H}" fill="transparent" id="hit"/>`;
  svg.innerHTML = g;
  const hv = svg.querySelector("#hv"), hit = svg.querySelector("#hit");
  const move = e => {
    const r = svg.getBoundingClientRect(), x = e.clientX - r.left;
    const i = Math.max(0, Math.min(pts.length - 1, Math.round((x - L) / (W - L - R) * (pts.length - 1))));
    const p = pts[i], px = X(i), py = Y(p[1]);
    hv.setAttribute("visibility", "visible");
    svg.querySelector("#hv-l").setAttribute("x1", px); svg.querySelector("#hv-l").setAttribute("x2", px);
    svg.querySelector("#hv-c").setAttribute("cx", px); svg.querySelector("#hv-c").setAttribute("cy", py);
    const dt = new Date(p[0] + "T12:00:00").toLocaleDateString([], { month: "short", day: "numeric", year: "numeric" });
    tip.innerHTML = `${dt}<br>${units(p[1])} after ${p[2].toLocaleString()} bets`;
    tip.hidden = false;
    tip.style.left = Math.max(80, Math.min(box.clientWidth - 80, px + 12)) + "px";
  };
  hit.addEventListener("pointermove", move);
  hit.addEventListener("pointerdown", move);
  hit.addEventListener("pointerleave", () => { hv.setAttribute("visibility", "hidden"); tip.hidden = true; });
}

function showTab(t) {
  document.querySelectorAll(".tabs button").forEach(b => b.setAttribute("aria-selected", b.dataset.tab === t));
  $("#v-tonight").hidden = t !== "tonight";
  $("#v-backtest").hidden = t !== "backtest";
  $("#title").textContent = t === "backtest" ? "Backtest" : "Tonight's picks";
  if (t === "backtest") drawCurve();
  try { localStorage.setItem("tab", t); } catch (e) {}
}
document.querySelectorAll(".tabs button").forEach(b => b.addEventListener("click", () => showTab(b.dataset.tab)));
window.addEventListener("resize", () => { if (!$("#v-backtest").hidden) drawCurve(); });
renderBacktest();
renderMarkets();
let startTab = "tonight";
try { startTab = location.hash === "#backtest" ? "backtest" : localStorage.getItem("tab") || "tonight"; } catch (e) {}
showTab(startTab);
</script>
