* { box-sizing: border-box }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 14px; line-height: 1.45 }

.wrap { max-width: 1180px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)) }
header { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 1px solid var(--line) }
.bar { display: flex; align-items: center; gap: 16px; padding-block: 12px; flex-wrap: wrap }

.tabs { display: flex; gap: 4px; padding-bottom: 0 }
.tab { appearance: none; border: 0; background: none; color: var(--muted); font: 600 14px var(--body); padding: 10px 12px; border-bottom: 2px solid transparent; cursor: pointer }
.tab[aria-selected="true"] { color: var(--fg); border-bottom-color: var(--accent) }
.tab:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px }
main { padding-block: 20px 48px }
.layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: 20px; align-items: start }
@media (max-width: 900px) { .layout { grid-template-columns: minmax(0, 1fr) } }
.note { color: var(--muted); font-size: 13px; max-width: 70ch; margin: 0 0 16px }

    <div class="layout">
      <div>
        <p class="note">Prices are what the sportsbook implies, in cents. A share pays $1 if it hits. <b>Model</b> is the bot's fair price. A green edge means the model thinks the share is underpriced. Everything here is play money.</p>
        <div class="grid" id="games"></div>
      </div>
      <aside class="slip empty" id="slip" aria-live="polite"></aside>
    </div>
  </section>

</main>

<script>
const D = JSON.parse(document.getElementById("data").textContent);
const START_CASH = 1000;
const KEY = "courtside.v1";
const SPREAD_PRICE = 110 / 210;

let state = { cash: START_CASH, bets: [] };
try { const s = JSON.parse(localStorage.getItem(KEY)); if (s && Array.isArray(s.bets)) state = s; } catch (e) {}
const save = () => { try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {} };

const $ = (s, el = document) => el.querySelector(s);
const money = v => (v < 0 ? "-$" : "$") + Math.abs(v).toFixed(2);
const cents = p => Math.round(p * 100) + "¢";
const pct = v => (v >= 0 ? "+" : "") + (v * 100).toFixed(1) + "%";
const imp = ml => ml > 0 ? 100 / (ml + 100) : -ml / (-ml + 100);
const fmtLine = v => (v > 0 ? "+" : "") + v;
const gameById = Object.fromEntries(D.games.map(g => [g.id, g]));
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

// Build each game's three markets: outcomes with a buy price (book, incl. vig) and the model's fair probability.
function markets(g) {
  const nick = n => (n || "").split(" ").slice(-1)[0];
  const H = nick(g.home_name) || g.home, A = nick(g.away_name) || g.away;
  const out = [];
  if (g.home_ml != null && g.away_ml != null) out.push({ key: "moneyline", title: "Winner", sub: "Moneyline " + fmtLine(g.away_ml) + " / " + fmtLine(g.home_ml), outs: [
    { side: "away", name: A, price: imp(g.away_ml), model: 1 - g.p_home_win },
    { side: "home", name: H, price: imp(g.home_ml), model: g.p_home_win }] });
  if (g.spread != null) out.push({ key: "spread", title: "Spread", sub: "Model margin " + H + " " + fmtLine(-g.pred_margin), outs: [
    { side: "away", name: A + " " + fmtLine(-g.spread), price: SPREAD_PRICE, model: 1 - g.p_home_cover },
    { side: "home", name: H + " " + fmtLine(g.spread), price: SPREAD_PRICE, model: g.p_home_cover }] });
  if (g.total != null) out.push({ key: "total", title: "Total points", sub: "Model total " + g.pred_total, outs: [
    { side: "over", name: "Over " + g.total, price: SPREAD_PRICE, model: g.p_over },
    { side: "under", name: "Under " + g.total, price: SPREAD_PRICE, model: 1 - g.p_over }] });
  return out;
}

function isLocked(g) { return g.final || (g.tip && new Date(g.tip) <= new Date()); }

function settle(b) {
  const g = gameById[b.game];
  if (!g || !g.final) return null;
  const m = g.home_pts - g.away_pts, tot = g.home_pts + g.away_pts;
  let r;
  if (b.market === "moneyline") r = b.side === "home" ? m > 0 : m < 0;
  else if (b.market === "spread") { const c = m + b.line; if (c === 0) return "push"; r = b.side === "home" ? c > 0 : c < 0; }
  else { if (tot === b.line) return "push"; r = b.side === "over" ? tot > b.line : tot < b.line; }
  return r ? "won" : "lost";
}
function payout(b, st) { return st === "won" ? b.shares : st === "push" ? b.stake : 0; }

function refreshWallet() {
  let inplay = 0, settled = 0;
  for (const b of state.bets) {
    const st = settle(b);
    if (!st) inplay += b.stake;
    else if (!b.paid) { state.cash += payout(b, st); b.paid = st; settled++; }
  }
  if (settled) save();
  const value = state.cash + inplay;
  $("#cash").textContent = money(state.cash);
  $("#inplay").textContent = money(inplay);
  const pnl = value - START_CASH;
  $("#pnl").textContent = (pnl >= 0 ? "+" : "") + money(pnl);
  $("#pnl").className = pnl > 0 ? "pos-c" : pnl < 0 ? "neg-c" : "";
}

let sel = null;
function renderGames() {
  const el = $("#games");
  if (!D.games.length) { el.innerHTML = '<div class="empty-state">No NBA games on the board for this date.</div>'; return; }
  el.innerHTML = D.games.map(g => {
    const t = g.tip ? new Date(g.tip) : null;
    const time = t ? t.toLocaleTimeString([], { hour: "numeric", minute: "2-digit" }) : "";
    const flags = [g.away_b2b ? "Away on back-to-back" : "", g.home_b2b ? "Home on back-to-back" : ""].filter(Boolean)
      .map(f => `<span class="flag">${f}</span>`).join(" ");
    const res = g.final ? `<div class="result">Final: ${esc(g.away)} ${g.away_pts} – ${esc(g.home)} ${g.home_pts}</div>` : "";
    const mk = markets(g).map(m => `
      <div class="mkt">
        <div class="mkt-h"><span>${m.title}</span><span>${esc(m.sub)}</span></div>
        ${m.key === "moneyline" ? `<div class="probbar" title="Model win chance"><i style="width:${(m.outs[0].model * 100).toFixed(1)}%"></i></div>` : ""}
        <div class="outs">${m.outs.map(o => {
          const edge = o.model - o.price;
          const isSel = sel && sel.game === g.id && sel.market === m.key && sel.side === o.side;
          return `<button class="out ${isSel ? "sel" : ""} ${edge > 0.02 ? "lean" : ""}" data-g="${g.id}" data-m="${m.key}" data-s="${o.side}" ${isLocked(g) ? "disabled" : ""} aria-label="Buy ${esc(o.name)} at ${cents(o.price)}">
            <span class="o-name">${esc(o.name)}</span>
            <span class="o-row"><span class="price">${cents(o.price)}</span><span class="model">model ${cents(o.model)}</span></span>
            <span class="o-row"><span class="edge ${edge > 0 ? "pos" : "neg"}">${pct(edge)} edge</span></span>
          </button>`; }).join("")}</div>
      </div>`).join("");
    return `<article class="card">
      <div class="matchup">
        <div class="teams">
          <div class="team"><span class="chip" style="background:#${g.away_color || "556"}">${esc(g.away)}</span><span class="nm">${esc(g.away_name || g.away)}</span> <span class="elo">Elo ${g.elo_away}</span></div>
          <div class="team"><span class="chip" style="background:#${g.home_color || "556"}">${esc(g.home)}</span><span class="nm">${esc(g.home_name || g.home)}</span> <span class="elo">Elo ${g.elo_home}</span></div>
        </div>
        <div class="tip"><b>${time}</b>${esc(g.status || "")}</div>
      </div>
      ${flags ? `<div>${flags}</div>` : ""}${res}${mk}
    </article>`;
  }).join("");
  el.querySelectorAll(".out").forEach(b => b.addEventListener("click", () => {
    sel = { game: b.dataset.g, market: b.dataset.m, side: b.dataset.s };
    renderGames(); renderSlip();
  }));
}

function selOutcome() {
  if (!sel) return null;
  const g = gameById[sel.game];
  const m = markets(g).find(x => x.key === sel.market);
  return { g, m, o: m.outs.find(x => x.side === sel.side) };
}

let lastToast = "";
function renderSlip() {
  const el = $("#slip");
  const s = selOutcome();
  el.classList.toggle("empty", !s);
  if (!s) {
    el.innerHTML = `<h3>Bet slip</h3><p class="sub">Pick an outcome to buy shares. Green-outlined outcomes are where the model sees at least a 2% edge.</p><div class="toast">${lastToast}</div>`;
    return;
  }
  const prev = $("#amt") ? $("#amt").value : "25";
  el.innerHTML = `
    <h3>${esc(s.o.name)}</h3>
    <div class="sub">${esc(s.g.away)} @ ${esc(s.g.home)} · ${s.m.title}</div>
    <label class="amt" for="amt"><span>$</span><input id="amt" inputmode="decimal" value="${esc(prev)}" aria-label="Amount"></label>
    <div class="quick"><button data-a="10">$10</button><button data-a="25">$25</button><button data-a="50">$50</button><button data-a="100">$100</button></div>
    <div class="kv"><span>Price</span><span>${cents(s.o.price)}</span></div>
    <div class="kv"><span>Model fair price</span><span>${cents(s.o.model)}</span></div>
    <div class="kv"><span>Shares</span><span id="sh"></span></div>
    <div class="kv"><span>Pays if it hits</span><span id="pay"></span></div>
    <div class="kv"><span>Expected value (model)</span><span id="ev"></span></div>
    <button class="buy" id="buy">Buy</button>
    <button class="ghost" id="cancel">Clear selection</button>`;
  const amt = $("#amt");
  const upd = () => {
    const a = parseFloat(amt.value) || 0, sh = a / s.o.price;
    $("#sh").textContent = sh.toFixed(2);
    $("#pay").textContent = money(sh);
    const ev = s.o.model * sh - a;
    $("#ev").textContent = (ev >= 0 ? "+" : "") + money(ev);
    $("#ev").className = ev > 0 ? "pos-c" : "neg-c";
    $("#buy").disabled = !(a > 0 && a <= state.cash) || isLocked(s.g);
    $("#buy").textContent = a > state.cash ? "Not enough cash" : "Buy " + s.o.name;
  };
  amt.addEventListener("input", upd);
  el.querySelectorAll(".quick button").forEach(b => b.addEventListener("click", () => { amt.value = b.dataset.a; upd(); }));
  $("#cancel").addEventListener("click", () => { sel = null; renderGames(); renderSlip(); });
  $("#buy").addEventListener("click", () => {
    const a = parseFloat(amt.value);
    if (!(a > 0 && a <= state.cash)) return;
    const line = s.m.key === "spread" ? s.g.spread : s.m.key === "total" ? s.g.total : null;
    state.cash -= a;
    state.bets.push({ id: Date.now(), game: s.g.id, date: D.date, market: s.m.key, side: s.o.side, name: s.o.name,
      matchup: s.g.away + " @ " + s.g.home, price: s.o.price, model: s.o.model, stake: a, shares: a / s.o.price, line });
    save();
    lastToast = `Bought ${(a / s.o.price).toFixed(2)} shares of ${s.o.name}.`;
    sel = null; renderGames(); renderSlip(); refreshWallet(); renderPositions();
  });
  upd();
}

function renderPositions() {
  const el = $("#v-positions");
  const rows = state.bets.slice().reverse();
  const closed = rows.filter(b => settle(b));
  const won = closed.filter(b => settle(b) === "won").length;
  el.innerHTML = `
    <div class="section">
      <div><h2>My positions</h2><p class="note">Bets settle when the page is refreshed with final scores. Saved in this browser only.</p></div>
      <div class="stats">
        <div class="stat"><div class="k">Positions</div><div class="v">${rows.length}</div><div class="s">${rows.length - closed.length} open</div></div>
        <div class="stat"><div class="k">Record</div><div class="v">${won}–${closed.length - won}</div><div class="s">settled bets</div></div>
        <div class="stat"><div class="k">Starting bankroll</div><div class="v">${money(START_CASH)}</div><div class="s">play money</div></div>
      </div>
      ${rows.length ? `<div class="tbl-wrap"><table>
        <thead><tr><th>Outcome</th><th>Game</th><th>Market</th><th>Price</th><th>Model</th><th>Stake</th><th>To win</th><th>Status</th></tr></thead>
        <tbody>${rows.map(b => { const st = settle(b) || "open"; return `<tr>
          <td>${esc(b.name)}</td><td>${esc(b.matchup)}</td><td>${b.market}</td>
          <td class="num">${cents(b.price)}</td><td class="num">${cents(b.model)}</td>
          <td class="num">${money(b.stake)}</td><td class="num">${money(b.shares)}</td>
          <td><span class="status ${st}">${st}</span></td></tr>`; }).join("")}</tbody></table></div>`
      : `<div class="empty-state">No positions yet. Open the Tonight tab and buy an outcome to start paper trading.</div>`}
      <div><button class="ghost" id="reset">Reset bankroll to ${money(START_CASH)}</button> <span id="reset-confirm"></span></div>
    </div>`;
  $("#reset").addEventListener("click", () => {
    $("#reset-confirm").innerHTML = `This clears every position. <button class="ghost" id="reset-yes">Yes, reset</button>`;
    $("#reset-yes").addEventListener("click", () => { state = { cash: START_CASH, bets: [] }; save(); refreshWallet(); renderPositions(); });
  });
}

// ---------- backtest ----------
const LABELS = { stats_only: "Stats only", market_blend: "Stats + line", market_gbm: "Boosted trees" };
let btModel = D.backtest.best || "market_blend";
function lineChart(series, colors) {
  const W = 760, H = 260, L = 52, R = 16, T = 14, B = 30;
  const all = Object.values(series).flat();
  if (!all.length) return "";
  const xs = all.map(p => +new Date(p[0])), ys = all.map(p => p[1]);
  const x0 = Math.min(...xs), x1 = Math.max(...xs);
  let y0 = Math.min(0, ...ys), y1 = Math.max(0, ...ys);
  const pad = (y1 - y0) * 0.08 || 1; y0 -= pad; y1 += pad;
  const sx = t => L + (t - x0) / (x1 - x0) * (W - L - R), sy = v => T + (y1 - v) / (y1 - y0) * (H - T - B);
  const step = Math.pow(10, Math.floor(Math.log10((y1 - y0) / 4)));
  const mult = [1, 2, 5, 10].find(m => (y1 - y0) / (step * m) <= 6) * step;
  let grid = "";
  for (let v = Math.ceil(y0 / mult) * mult; v <= y1; v += mult)
    grid += `<line x1="${L}" x2="${W - R}" y1="${sy(v)}" y2="${sy(v)}" stroke="var(--line)" stroke-width="${v === 0 ? 1.5 : 1}"/><text x="${L - 8}" y="${sy(v) + 4}" text-anchor="end" font-size="11" fill="var(--muted)" font-family="var(--mono)">${v > 0 ? "+" : ""}${Math.round(v)}u</text>`;
  const years = [];
  for (let y = new Date(x0).getFullYear() + 1; y <= new Date(x1).getFullYear(); y++) years.push(y);
  const xl = years.map(y => { const x = sx(+new Date(y, 0, 1)); return `<line x1="${x}" x2="${x}" y1="${T}" y2="${H - B}" stroke="var(--line)" stroke-dasharray="2 4"/><text x="${x}" y="${H - 10}" text-anchor="middle" font-size="11" fill="var(--muted)">${y}</text>`; }).join("");
  const paths = Object.entries(series).map(([k, pts]) => {
    if (!pts.length) return "";
    const d = pts.map((p, i) => (i ? "L" : "M") + sx(+new Date(p[0])).toFixed(1) + " " + sy(p[1]).toFixed(1)).join(" ");
    const last = pts[pts.length - 1];
    return `<path d="${d}" fill="none" stroke="${colors[k]}" stroke-width="2" stroke-linejoin="round"/><circle cx="${sx(+new Date(last[0]))}" cy="${sy(last[1])}" r="3.5" fill="${colors[k]}"/>`;
  }).join("");
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Cumulative profit in units">${grid}${xl}${paths}</svg>`;
}

function renderBacktest() {
  const el = $("#v-backtest");
  const bt = D.backtest[btModel], acc = bt.accuracy;
  const colors = { moneyline: "var(--accent)", spread: "var(--yes)", total: "var(--warn)" };
  const thr = Object.keys(bt.by_threshold);
  const cell = v => v.bets ? `<td class="num">${v.bets}</td><td class="num">${(v.win_rate * 100).toFixed(1)}%</td><td class="num ${v.roi > 0 ? "pos-c" : "neg-c"}">${pct(v.roi)}</td>` : `<td class="num">0</td><td>–</td><td>–</td>`;
  el.innerHTML = `
    <div class="section">
      <div style="display:flex;justify-content:space-between;align-items:end;gap:12px;flex-wrap:wrap">
        <div><h2>How the bot did on ${acc.games.toLocaleString()} past games</h2>
        <p class="note">Walk-forward test on every season with betting lines: each month the model is retrained only on games before it, then bets that month at the closing line with flat 1-unit stakes. Spreads and totals assume −110, so you need 52.4% to break even. ★ marks the version with the most accurate win probabilities, which drives tonight's prices (currently ${LABELS[D.backtest.best] || D.backtest.best}).</p></div>
        <div class="seg" role="group" aria-label="Model version">
          ${Object.keys(LABELS).filter(k => D.backtest[k]).map(k => `<button data-m="${k}" aria-pressed="${btModel === k}">${LABELS[k]}${k === D.backtest.best ? " ★" : ""}</button>`).join("")}
        </div>
      </div>
      <div class="stats">
        <div class="stat"><div class="k">Picks the winner</div><div class="v">${(acc.winner_acc_model * 100).toFixed(1)}%</div><div class="s">book favorite: ${(acc.winner_acc_market * 100).toFixed(1)}%</div></div>
        <div class="stat"><div class="k">Win-prob error (Brier)</div><div class="v">${acc.brier_model.toFixed(4)}</div><div class="s">book: ${acc.brier_market.toFixed(4)} · lower is better</div></div>
        <div class="stat"><div class="k">Margin miss (avg)</div><div class="v">${acc.margin_mae_model} pts</div><div class="s">spread: ${acc.margin_mae_market} pts</div></div>
        <div class="stat"><div class="k">Total miss (avg)</div><div class="v">${acc.total_mae_model} pts</div><div class="s">book total: ${acc.total_mae_market} pts</div></div>
      </div>
      <div><h4>Cumulative profit, betting every 4%+ edge</h4>
      <div class="chart">${lineChart(D.curves[btModel], colors)}
        <div class="legend">${Object.keys(colors).map(k => `<span><i style="background:${colors[k]}"></i>${k}</span>`).join("")}</div></div></div>
      <div><h4>Results by minimum edge</h4>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Min edge</th><th>ML bets</th><th>Win</th><th>ROI</th><th>Spread bets</th><th>Win</th><th>ROI</th><th>Total bets</th><th>Win</th><th>ROI</th></tr></thead>
        <tbody>${thr.map(t => { const r = bt.by_threshold[t]; return `<tr><td>${(t * 100).toFixed(0)}%+</td>${cell(r.moneyline)}${cell(r.spread)}${cell(r.total)}</tr>`; }).join("")}</tbody>
      </table></div></div>
      <div><h4>By season, 4%+ edge</h4>
      <div class="tbl-wrap"><table>
        <thead><tr><th>Season</th><th>ML bets</th><th>Win</th><th>ROI</th><th>Spread bets</th><th>Win</th><th>ROI</th><th>Total bets</th><th>Win</th><th>ROI</th></tr></thead>
        <tbody>${Object.entries(bt.by_season).map(([s, r]) => `<tr><td>${s - 1}–${String(s).slice(2)}</td>${cell(r.moneyline)}${cell(r.spread)}${cell(r.total)}</tr>`).join("")}</tbody>
      </table></div></div>
    </div>`;
  el.querySelectorAll(".seg button").forEach(b => b.addEventListener("click", () => { btModel = b.dataset.m; renderBacktest(); }));
}

function show(view) {
  document.querySelectorAll(".tab").forEach(t => t.setAttribute("aria-selected", t.dataset.view === view));
  ["markets", "positions", "backtest"].forEach(v => $("#v-" + v).hidden = v !== view);
}
document.querySelectorAll(".tab").forEach(t => t.addEventListener("click", () => { show(t.dataset.view); if (location.hash !== "#" + t.dataset.view) history.replaceState(null, "", "#" + t.dataset.view); }));
const initial = (location.hash || "").slice(1);
if (["markets", "positions", "backtest"].includes(initial)) show(initial);

$("#date").textContent = new Date(D.date + "T12:00:00").toLocaleDateString([], { weekday: "long", month: "short", day: "numeric" }) + " · lines updated " + D.generated.replace("T", " ");
renderGames(); renderSlip(); refreshWallet(); renderPositions(); renderBacktest();
</script>
